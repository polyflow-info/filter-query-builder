name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'polyflow-info/filter-query-builder'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Validate release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match the package version.');
          assert.equal(lock.version, version, 'Lockfile version must match the package version.');
          assert.equal(lock.packages[''].version, version, 'Root lockfile package version must match.');
          const prerelease = version.includes('-');
          assert.equal(process.env.RELEASE_PRERELEASE, String(prerelease), 'GitHub prerelease status must match the package version.');
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${prerelease ? 'next' : 'latest'}\n`);
          NODE
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm run build
      - run: npm test
      - name: Pack the package
        id: package
        run: |
          tarball=$(npm pack --silent)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish with trusted publishing
        run: npm publish "$TARBALL" --access public --tag "$DIST_TAG"
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
